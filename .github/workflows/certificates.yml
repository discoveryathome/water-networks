name: Verify submitted certificates with base code
on:
  pull_request:
    paths: ['submissions/**/*.json']
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: echo "WNTR carries the EPANET library"
      - run: python -m pip install uv==0.11.8 && sh tools/setup.sh
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: candidate-data
          persist-credentials: false
      - name: Import candidate objects without executing candidate code
        run: |
          git fetch --no-tags ./candidate-data HEAD:refs/remotes/origin/candidate
          .venv/bin/python tools/check_pr_certificates.py refs/remotes/origin/candidate
