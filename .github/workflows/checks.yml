name: Build and scientific checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-10-23
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, resolved 2026-10-23
        with:
          python-version: '3.12'
      - run: echo "WNTR carries the EPANET library"
      - run: python -m pip install uv==0.11.8
      - run: sh tools/setup.sh
      - run: .venv/bin/python tools/check.py
      - run: .venv/bin/python tools/verify_active.py
